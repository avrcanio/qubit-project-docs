services:
  coturn:
    image: coturn/coturn:4.7.0-r2
    container_name: coturn
    restart: unless-stopped
    command: ["turnserver", "-c", "/etc/coturn/turnserver.conf", "-n"]
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./data:/var/lib/coturn
      - ./secrets/turn_static_auth_secret:/run/secrets/turn_static_auth_secret:ro
      # Optional TLS certs
      # - ./certs:/certs:ro
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
      # Optional TURN-TLS
      # - "5349:5349/tcp"
